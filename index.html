<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
</head>
<body>
    <header class="siteHeader">
        <h1 class="siteHeader__title">Music Player</h1>
    </header>
    <main class="appLayout">
        <section class="playlist" id="playlist">
            <h2 class="playlist__title">My Playlist</h2>
        </section>
        <section class="collection" id="collection">
            <h2 class="collection__title">Music Collection</h2>
            <div class="collection__search">
                <label for="searchInput">Search songs</label>
                <input type="search" id="searchInput" placeholder="Search title or artist...">
            </div>
        </section>
    </main>
</body>
</html>
