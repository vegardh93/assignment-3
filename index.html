<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Header. -->
    <header class="siteHeader">
        <h1 class="siteHeader__title">Music Player</h1>
    </header>
    <!-- Main content. -->
    <main class="appLayout">
        <!-- Playlist. -->
        <section class="playlist" id="playlist">
            <h2 class="playlist__title">My Playlist</h2>
            <!-- Number of songs in the playlist. -->
            <p class="playlist__count" id="playlistCount">0 songs</p>
            <!-- Total playlist duration. -->
            <p class="playlist__duration">
                Total duration: <span id="playlistDuration">0:00</span>
            </p>
            <!-- Button for clearing the playlist. -->
            <button class="playlist__clearButton" id="clearPlaylistButton" type="button" disabled>Clear Playlist</button>
            <!-- Displayed when the playlist contains no songs. -->
            <p class="playlist__empty" id="playlistEmpty">
                Your playlist is empty.
            </p>
            <!-- List that displays songs added to the playlist. -->
            <ul class="playlist__items" id="playlistItems"></ul>
        </section>
        <!-- Displays available songs and controls for browsing them. -->
        <section class="collection" id="collection">
            <h2 class="collection__title">Music Collection</h2>
            <!-- Number of songs matching the current search and filter. -->
            <p class="collection__count" id="resultsCount">23 of 23 songs</p>
            <!-- Search field for song titles and artists. -->
            <div class="collection__search">
                <label for="searchInput">Search songs</label>
                <input type="search" id="searchInput" placeholder="Search title or artist...">
            </div>
            <!-- Genre filter. -->
            <div class="collection__filter">
                <label for="genreFilter">Genre</label>
                <select id="genreFilter">
                    <option value="all">All Genres</option>
                    <option value="Electronic">Electronic</option>
                    <option value="Jazz">Jazz</option>
                    <option value="Metal">Metal</option>
                    <option value="Pop">Pop</option>
                    <option value="Rock">Rock</option>
                </select>
            </div>
            <!-- Song sorting options. -->
            <div class="collection__sort">
                <label for="sortSelect">Sort by</label>
                <select id="sortSelect">
                    <option value="default">Default Order</option>
                    <option value="titleAscending">Title (A-Z)</option>
                    <option value="titleDescending">Title (Z-A)</option>
                    <option value="artistAscending">Artist (A-Z)</option>
                    <option value="artistDescending">Artist (Z-A)</option>
                    <option value="durationAscending">Duration (Shortest First)</option>
                    <option value="durationDescending">Duration (Longest First)</option>
                </select>
            </div>
            <!-- Container for song cards. -->
            <div class="collection__songGrid" id="songGrid"></div>
            <!-- Displayed when no songs are found. -->
            <p class="collection__empty" id="collectionEmpty" hidden>
                No songs found.
            </p>
        </section>
    </main>
    <!-- Loads the song data. -->
    <script src="./data/songs.js"></script>
    <!-- Loads the application functionality. -->
    <script src="./js/app.js"></script>
</body>
</html>
